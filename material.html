<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e79" />
  <title>物资领用申请</title>
  <style>
    :root {
      --bg: #f0f3f7;
      --card: #fff;
      --ink: #1a2332;
      --muted: #5a6a7a;
      --line: #d8e0ea;
      --brand: #1f4e79;
      --brand2: #2e6da4;
      --ok: #1b7a4e;
      --danger: #b42318;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background: radial-gradient(1000px 400px at 0% -10%, #d9e8f7, transparent 55%), var(--bg);
      min-height: 100vh;
      padding: 20px 16px 40px;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 16px; }
    .brand { font-size: 13px; color: var(--brand); font-weight: 700; line-height: 1.45; }
    h1 { margin: 6px 0 0; font-size: 22px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs button {
      flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 10px; font-weight: 650; cursor: pointer;
    }
    .tabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .panel { display: none; }
    .panel.show { display: block; }
    form, .query-box {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; display: grid; gap: 12px;
      box-shadow: 0 8px 28px rgba(31, 78, 121, 0.08);
    }
    label { display: grid; gap: 6px; grid-template-rows: auto auto; font-size: 13px; color: var(--muted); font-weight: 600; }
    .field-label { line-height: 1.35; }
    .field-label.req::after { content: " *"; color: var(--danger); }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 10px;
      padding: 12px; font-size: 16px; font-family: inherit; background: #fbfcfe;
    }
    input.qty-over { border-color: var(--danger); background: #fff8f7; }
    textarea { min-height: 64px; resize: vertical; }
    .items-head {
      font-size: 13px; font-weight: 700; color: var(--brand);
      display: flex; justify-content: space-between; align-items: center;
    }
    .item-row {
      border: 1px dashed var(--line); border-radius: 12px; padding: 12px;
      display: grid; gap: 10px; background: #f8fafc;
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row3 { display: grid; grid-template-columns: 1.1fr 0.75fr 0.85fr; gap: 10px; align-items: start; }
    .qty-err { font-size: 12px; color: var(--danger); margin: 4px 0 0; line-height: 1.4; display: none; }
    .qty-err.show { display: block; }
    .btn-line {
      border: 1px solid var(--line); background: #f7f9fc; border-radius: 10px;
      padding: 10px; font-weight: 650; cursor: pointer;
    }
    .btn-del { color: var(--danger); font-size: 13px; justify-self: end; background: none; border: 0; cursor: pointer; }
    button.primary {
      border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700;
      color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand2)); cursor: pointer;
    }
    button.primary:disabled { opacity: 0.55; }
    .msg { padding: 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; display: none; }
    .msg.show { display: block; }
    .msg.ok { background: #e8f6ee; color: var(--ok); border: 1px solid #b7e0c7; }
    .msg.err { background: #fdecec; color: var(--danger); border: 1px solid #f3c1bd; }
    .ok-box {
      background: #e8f6ee; border: 1px solid #b7e0c7; border-radius: 12px; padding: 14px;
      display: none; gap: 8px; font-size: 14px;
    }
    .ok-box.show { display: grid; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
    .status-card { font-size: 14px; line-height: 1.55; }
    .status-card strong { color: var(--brand); }
    .gate-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 16px 20px; display: grid; gap: 12px;
      box-shadow: 0 8px 28px rgba(31, 78, 121, 0.08);
    }
    .user-bar {
      display: none; align-items: center; justify-content: space-between; gap: 10px;
      margin: 0 0 12px; padding: 10px 12px; background: var(--card);
      border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 8px 28px rgba(31, 78, 121, 0.08); font-size: 14px;
    }
    .user-bar.show { display: flex; }
    .user-bar .name { font-weight: 700; color: var(--brand); }
    .user-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-logout, .btn-change-code {
      border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 6px 12px; font-size: 13px; font-weight: 650; cursor: pointer; font-family: inherit;
    }
    .btn-change-code { color: var(--brand); }
    .btn-logout { color: var(--muted); }
    .change-banner {
      display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #b7d4f0; background: #eef6fc; font-size: 13px; line-height: 1.5;
    }
    .change-banner.show { display: grid; gap: 8px; }
    .change-banner .acts { display: flex; gap: 8px; }
    .change-banner .acts button {
      flex: 1; border: 0; border-radius: 8px; padding: 8px; font-weight: 650; cursor: pointer; font-family: inherit;
    }
    .change-banner .acts .primary { background: var(--brand); color: #fff; }
    .change-banner .acts .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .code-mask {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    .code-mask.show { display: flex; }
    .code-dialog {
      width: 100%; max-width: 400px; background: #fff; border-radius: 14px;
      padding: 18px 16px; display: grid; gap: 12px;
    }
    .code-dialog h2 { margin: 0; font-size: 18px; }
    .code-dialog .acts { display: flex; gap: 8px; }
    .code-dialog .acts button {
      flex: 1; border: 0; border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .code-dialog .acts .primary { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; }
    .code-dialog .acts .ghost { background: #eef2f6; color: var(--ink); }
    .mine-toolbar {
      display: flex; justify-content: flex-end; margin-bottom: 8px;
    }
    .mine-toolbar button {
      border: 1px solid var(--line); background: #fff; border-radius: 8px;
      padding: 8px 12px; font-size: 13px; font-weight: 650; cursor: pointer;
    }
    .mine-list { display: grid; gap: 8px; }
    .mine-item {
      display: grid; gap: 4px; width: 100%; text-align: left;
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
      background: #fbfcfe; cursor: pointer; font-family: inherit;
    }
    .mine-item:active { background: #eef3f8; }
    .mine-item .row1 {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; font-weight: 700; color: var(--brand);
    }
    .mine-item .row2 { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .mine-empty { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.55; padding: 16px 8px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    }
    .badge.pending { background: #fff3cd; color: #856404; }
    .badge.approved { background: #e8f6ee; color: var(--ok); }
    .badge.rejected, .badge.denied { background: #fdecec; color: var(--danger); }
    .record-detail {
      display: none; margin-top: 12px; padding: 12px;
      border: 1px solid var(--line); border-radius: 12px; background: #f8fafc;
      font-size: 14px; line-height: 1.55;
    }
    .record-detail.show { display: block; }
    .record-detail p { margin: 0 0 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand" id="company">中铁十八局集团南方工程有限公司</div>
      <h1>物资领用申请</h1>
      <p class="hint">填写要领用的物资，提交后由办公室审批。</p>

    <div class="gate-card" id="gateBox" style="display:none">
      <label><span class="field-label req">登记口令</span>
        <input id="accessCodeInput" type="text" autocomplete="off" spellcheck="false" placeholder="办公室发给你的个人口令" />

      <div class="msg" id="gateMsg"></div>

    <div id="appMain" style="display:none">
    <div class="user-bar" id="userBar">
      <span class="name" id="userGreeting">您好</span>
      <div class="user-actions">
        <button type="button" class="btn-change-code" id="btnChangeCode">修改口令</button>

    <div id="submitPanel" class="panel show">
      <form id="form">
        <label>申请日期
          <input id="applyDate" type="date" />
        </label>
        <div class="items-head">
          <span>申请物资</span>
          <button type="button" class="btn-line" id="btnAddRow">+ 加一行</button>
        </div>
        <div id="itemsBox"></div>
        <label>用途说明
          <input id="purpose" type="text" maxlength="200" placeholder="如：办公使用、食堂采购" />
        </label>
        <label>备注
          <textarea id="note" maxlength="300" placeholder="可选"></textarea>
        </label>
        <button type="submit" class="primary" id="btnSubmit">提交申请</button>
        <div class="msg" id="msg"></div>
        <div class="ok-box" id="okBox">
          <div>提交成功！申请编号：<strong id="okId"></strong></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn-line" id="btnCopyId">复制编号</button>

    <div id="queryPanel" class="panel">
      <div class="query-box">
        <div class="mine-toolbar">
          <button type="button" class="btn-line" id="btnRefreshMine">刷新</button>
        </div>
        <div class="msg" id="queryMsg"></div>
        <div class="mine-list" id="mineList"></div>
        <div class="record-detail" id="mineDetail"></div>
        <p class="hint" style="margin-top:12px">显示本人全部申请；刚提交若暂无结果，请隔几秒点刷新。公网页仅显示近 72 小时内有状态回写的申请。</p>
      </div>
    </div>
    </div>

  <div class="code-mask" id="codeMask">
    <div class="code-dialog" role="dialog" aria-labelledby="codeDlgTitle">
      <h2 id="codeDlgTitle">修改登记口令</h2>
      <p class="hint">新口令须为 6 位小写字母与数字，且同时包含字母和数字（不含 4）。</p>
      <label>新口令
        <input id="newCodeInput" type="text" autocomplete="new-password" maxlength="6" spellcheck="false" placeholder="如 abc123" />
      </label>
      <label>确认新口令
        <input id="newCodeConfirm" type="text" autocomplete="new-password" maxlength="6" spellcheck="false" />
      </label>
      <div class="msg" id="changeCodeMsg"></div>
      <div class="acts">
        <button type="button" class="ghost" id="btnChangeCancel">取消</button>
        <button type="button" class="primary" id="btnChangeSubmit">保存</button>
      </div>
    </div>
  </div>

  <script>window.__MATERIAL_PUBLIC__={"ntfyServer":"https://ntfy.sh","ntfyTopic":"yue-trip-lk56m7z8ray1fq293p4d","company":"中铁十八局集团南方工程有限公司","needAccessCode":true,"applyOptions":[{"code":"0612260824000601","name":"抽纸.得宝","spec":"88抽","unit":"提","available":6,"vendor":"山姆","location":"仓库","price":"59.90"},{"code":"0612260824000901","name":"抽纸.MM","spec":"100抽*24包","unit":"提","available":9,"vendor":"山姆","location":"仓库","price":"39.90"},{"code":"0408260822001001","name":"桶装水","spec":"19L","unit":"桶","available":10,"vendor":"叶利辉","location":"仓库","price":"20.00"}],"accessCodes":[{"code":"ycj330","name":"杨长京"},{"code":"zjh355","name":"赵君辉"},{"code":"wt0765","name":"王涛"},{"code":"whj656","name":"王惠建"},{"code":"zly358","name":"张凌源"},{"code":"lwy858","name":"刘伟英"},{"code":"tlx957","name":"唐立新"},{"code":"xb0193","name":"肖兵"},{"code":"dc0775","name":"杜琛"},{"code":"qs0588","name":"乔石"},{"code":"fwp897","name":"范未鹏"},{"code":"lxj923","name":"李新纪"},{"code":"wht881","name":"王昊天"},{"code":"hlx551","name":"何凌霄"},{"code":"fy0395","name":"符乐"},{"code":"tks862","name":"唐康生"},{"code":"zt0658","name":"张跳"}],"optionsUrl":"material-options.json","cloudQueue":{"enabled":true,"baseUrl":"https://office-queue.fyysecret25.workers.dev"},"updatedAt":"2026-08-24T09:50:02.536Z"};</script>


  <script>
    const PUB = window.__MATERIAL_PUBLIC__ || null;
    const IS_PUBLIC = !!PUB;
    const API = IS_PUBLIC ? '' : '/api/material-request';
    const NTFY = IS_PUBLIC
      ? { server: String(PUB.ntfyServer || 'https://ntfy.sh').replace(/\/$/, ''), topic: String(PUB.ntfyTopic || '') }
      : null;
    const CLOUD = IS_PUBLIC && PUB.cloudQueue?.enabled && PUB.cloudQueue?.baseUrl
      ? { baseUrl: String(PUB.cloudQueue.baseUrl).replace(/\/$/, '') }
      : null;
    const $ = (id) => document.getElementById(id);

    let accessCode = (new URLSearchParams(location.search).get('k') || localStorage.getItem('material_request_code') || '').trim();
    let accessName = localStorage.getItem('material_request_name') || '';
    let needAccessCode = false;
    let applyOptions = [];

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function optionLabel(item) {
      const spec = item.spec ? ` · ${item.spec}` : '';
      return `${item.name}${spec}`;
    }

    function buildMaterialOptions(selectedCode = '') {
      return ['<option value="">请选择物资</option>']
        .concat(
          applyOptions.map((item) => {
            const label = optionLabel(item);
            const sel = item.code === selectedCode ? ' selected' : '';
            return `<option value="${esc(item.code)}"${sel}>${esc(label)}</option>`;
          }),
        )
        .join('');
    }

    function itemTemplate(idx, selectedCode = '') {
      return `<div class="item-row" data-idx="${idx}">
        <label><span class="field-label req">物资名称</span>
          <select class="item-material" data-f="code" required>${buildMaterialOptions(selectedCode)}</select>
        </label>
        <div class="row3">
          <label><span class="field-label">规格</span><input data-f="spec" maxlength="120" readonly placeholder="自动带出" /></label>
          <label><span class="field-label">单位</span><input data-f="unit" maxlength="20" readonly placeholder="自动带出" /></label>
          <label><span class="field-label req">数量</span><input data-f="qty" type="number" min="1" step="1" placeholder="整数" /></label>
        </div>
        <p class="qty-err">申请数量超过可领用库存，请调整数量</p>
        ${idx > 0 ? '<button type="button" class="btn-del" data-del>删除本行</button>' : ''}
      </div>`;
    }

    function fillRowFromOption(row, code) {
      const item = applyOptions.find((x) => x.code === code);
      if (!item) {
        row.querySelector('[data-f="spec"]').value = '';
        row.querySelector('[data-f="unit"]').value = '';
        updateRowQtyState(row);
        return;
      }
      row.querySelector('[data-f="spec"]').value = item.spec || '';
      row.querySelector('[data-f="unit"]').value = item.unit || '';
      updateRowQtyState(row);
    }

    function updateRowQtyState(row) {
      const code = row.querySelector('[data-f="code"]')?.value.trim() || '';
      const item = applyOptions.find((x) => x.code === code);
      const qtyInput = row.querySelector('[data-f="qty"]');
      const err = row.querySelector('.qty-err');
      if (!qtyInput) return;
      const raw = qtyInput.value.trim();
      let over = false;
      if (item && raw) {
        const qty = Number(raw);
        over = Number.isFinite(qty) && qty > item.available;
      }
      qtyInput.classList.toggle('qty-over', over);
      if (err) err.classList.toggle('show', over);
      updateSubmitButton();
    }

    function updateSubmitButton() {
      const rows = [...document.querySelectorAll('.item-row')];
      const blocked = rows.some((row) => row.querySelector('.qty-err.show'));
      $('btnSubmit').disabled = blocked;
    }

    function bindItemRow(row) {
      const select = row.querySelector('.item-material');
      select?.addEventListener('change', () => fillRowFromOption(row, select.value.trim()));
      const qtyInput = row.querySelector('[data-f="qty"]');
      qtyInput?.addEventListener('input', () => updateRowQtyState(row));
      row.querySelector('[data-del]')?.addEventListener('click', () => {
        row.remove();
        if (!document.querySelector('.item-row')) renderItems(1);
        updateSubmitButton();
      });
    }

    function renderItems(count) {
      const box = $('itemsBox');
      box.innerHTML = '';
      for (let i = 0; i < count; i++) {
        box.insertAdjacentHTML('beforeend', itemTemplate(i));
        bindItemRow(box.lastElementChild);
      }
      refreshMaterialSelects();
    }

    function refreshMaterialSelects() {
      document.querySelectorAll('.item-row').forEach((row) => {
        const select = row.querySelector('.item-material');
        if (!select) return;
        const cur = select.value;
        select.innerHTML = buildMaterialOptions(cur);
        fillRowFromOption(row, select.value.trim());
      });
      const head = document.querySelector('.items-head span');
      if (head) head.textContent = applyOptions.length ? `申请物资（${applyOptions.length} 种可选）` : '申请物资';
      updateSubmitButton();
    }

    async function loadApplyOptions() {
      if (IS_PUBLIC) {
        try {
          const rel = PUB.optionsUrl || 'material-options.json';
          const bust = encodeURIComponent(PUB.updatedAt || Date.now());
          const r = await fetch(`${rel}?t=${bust}`);
          if (r.ok) {
            const data = await r.json();
            applyOptions = data.items || [];
          } else {
            applyOptions = PUB.applyOptions || [];
          }
        } catch {
          applyOptions = PUB.applyOptions || [];
        }
        refreshMaterialSelects();
        return;
      }
      try {
        const r = await fetch(`${API}/apply-options`);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '加载物资选项失败');
        applyOptions = data.items || [];
      } catch (e) {
        applyOptions = [];
        show($('msg'), e.message || '物资选项加载失败', false);
      }
      refreshMaterialSelects();
    }

    function resolvePublicAccess(code) {
      const c = String(code || '').trim();
      if (!c) return null;
      return (PUB.accessCodes || []).find((row) => String(row.code || '').trim() === c) || null;
    }

    async function fetchPublicStatusMessages() {
      const url = `${NTFY.server}/${encodeURIComponent(NTFY.topic)}/json?poll=1&since=72h`;
      const r = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error('查询失败 HTTP ' + r.status);
      const text = (await r.text()).trim();
      if (!text) return [];
      const out = [];
      for (const line of text.split('\n')) {
        if (!line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }
        if (!msg || msg.event !== 'message') continue;
        let body = {};
        try { body = typeof msg.message === 'string' ? JSON.parse(msg.message) : (msg.message || {}); } catch { continue; }
        if (body.type !== 'material_status') continue;
        out.push({ body, time: Number(msg.time) || 0 });
      }
      return out;
    }

    async function findPublicStatusByTokenCloud(token) {
      if (!CLOUD) return null;
      const r = await fetch(`${CLOUD.baseUrl}/v1/status/${encodeURIComponent(token)}`, {
        headers: { Accept: 'application/json' },
      });
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('云端查询失败 HTTP ' + r.status);
      const j = await r.json();
      if (!j.found) return null;
      return {
        id: j.id,
        clientToken: j.clientToken,
        status: j.status,
        rejectReason: j.rejectReason || '',
      };
    }

    async function findPublicStatusByToken(token) {
      try {
        const cloud = await findPublicStatusByTokenCloud(token);
        if (cloud) return cloud;
      } catch (_) { /* fallback ntfy */ }
      const list = await fetchPublicStatusMessages();
      let best = null;
      for (const row of list) {
        if (String(row.body.clientToken || '') !== String(token)) continue;
        if (!best || row.time >= best._t) best = Object.assign({}, row.body, { _t: row.time });
      }
      return best;
    }

    function myIdsKey() {
      return `material_my_ids_${accessCode || '_'}`;
    }
    function loadMyIdList() {
      try {
        return JSON.parse(localStorage.getItem(myIdsKey()) || '[]');
      } catch {
        return [];
      }
    }
    function addMyId(id, meta = {}) {
      if (!id) return;
      const list = loadMyIdList().filter((x) => x.id !== id);
      list.unshift({
        id: String(id),
        applyDate: meta.applyDate || '',
        purpose: meta.purpose || '',
        items: meta.items || [],
        submittedAt: meta.submittedAt || new Date().toISOString(),
      });
      localStorage.setItem(myIdsKey(), JSON.stringify(list.slice(0, 100)));
    }

    function publicStatusText(status) {
      return ({ pending: '待审批', approved: '已通过', rejected: '已驳回', denied: '未受理' })[status] || status;
    }

    function collectItems() {
      const rows = [...document.querySelectorAll('.item-row')];
      return rows.map((row) => {
        const code = row.querySelector('[data-f="code"]')?.value.trim() || '';
        const item = applyOptions.find((x) => x.code === code);
        return {
          code,
          name: item?.name || '',
          spec: row.querySelector('[data-f="spec"]').value.trim(),
          unit: row.querySelector('[data-f="unit"]').value.trim(),
          qty: row.querySelector('[data-f="qty"]').value.trim(),
        };
      });
    }

    function show(el, text, ok) {
      el.textContent = text;
      el.className = 'msg show ' + (ok ? 'ok' : 'err');
    }
    function showGateMsg(ok, text) {
      show($('gateMsg'), text, ok);
    }
    function updateUserBar() {
      const bar = $('userBar');
      if (!needAccessCode) {
        bar.classList.remove('show');
        return;
      }
      bar.classList.add('show');
      $('userGreeting').textContent = accessName ? `您好，${accessName}` : '您好';
    }
    function enterApp() {
      $('gateBox').style.display = 'none';
      $('appMain').style.display = 'block';
      updateUserBar();
      loadApplyOptions();
    }
    function logout() {
      accessCode = '';
      accessName = '';
      localStorage.removeItem('material_request_code');
      localStorage.removeItem('material_request_name');
      $('gateBox').style.display = 'grid';
      $('appMain').style.display = 'none';
      $('userBar').classList.remove('show');
      $('accessCodeInput').value = '';
      showGateMsg(true, '已退出，请重新登录');
    }
    function maybeShowChangeBanner(should) {
      const dismissed = sessionStorage.getItem('material_change_banner_dismissed') === '1';
      $('changeBanner').classList.toggle('show', !!should && !dismissed);
    }
    async function unlockWithCode(code) {
      const c = String(code || '').trim();
      if (!c) {
        showGateMsg(false, '请填写登记口令');
        return false;
      }
      const btn = $('btnUnlock');
      btn.disabled = true;
      showGateMsg(true, '正在验证…');
      try {
        if (IS_PUBLIC) {
          const row = resolvePublicAccess(c);
          if (!row) throw new Error('口令无效');
          accessCode = c;
          accessName = row.name || '';
          localStorage.setItem('material_request_code', c);
          if (accessName) localStorage.setItem('material_request_name', accessName);
          enterApp();
          return true;
        }
        const r = await fetch(`${API}/session?k=${encodeURIComponent(c)}`, {
          headers: { 'X-Access-Code': c },
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '口令无效');
        accessCode = c;
        accessName = data.name || '';
        localStorage.setItem('material_request_code', c);
        if (accessName) localStorage.setItem('material_request_name', accessName);
        enterApp();
        maybeShowChangeBanner(data.shouldPromptChangeCode);
        return true;
      } catch (e) {
        showGateMsg(false, e.message || '口令无效');
        return false;
      } finally {
        btn.disabled = false;
      }
    }

    async function loadMeta() {
      $('applyDate').value = new Date().toISOString().slice(0, 10);
      if (IS_PUBLIC) {
        $('company').textContent = PUB.company || '';
        needAccessCode = !!PUB.needAccessCode;
        $('btnChangeCode').style.display = 'none';
        $('changeBanner').style.display = 'none';
        if (needAccessCode) {
          if (accessCode) await unlockWithCode(accessCode);
          else {
            $('gateBox').style.display = 'grid';
            $('appMain').style.display = 'none';
            const k = new URLSearchParams(location.search).get('k') || '';
            if (k) $('accessCodeInput').value = k;
          }
        } else {
          enterApp();
        }
        return;
      }
      const r = await fetch(`${API}/meta`);
      const data = await r.json();
      $('company').textContent = data.company || '';
      needAccessCode = !!data.needAccessCode;
      if (needAccessCode) {
        if (accessCode) await unlockWithCode(accessCode);
        else {
          $('gateBox').style.display = 'grid';
          $('appMain').style.display = 'none';
          const k = new URLSearchParams(location.search).get('k') || '';
          if (k) $('accessCodeInput').value = k;
        }
      } else {
        enterApp();
      }
    }

    $('btnUnlock').addEventListener('click', () => { unlockWithCode($('accessCodeInput').value); });
    $('accessCodeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlockWithCode($('accessCodeInput').value);
    });
    $('btnLogout').addEventListener('click', logout);
    $('btnChangeCode').addEventListener('click', () => {
      $('codeMask').classList.add('show');
      $('newCodeInput').value = '';
      $('newCodeConfirm').value = '';
      $('changeCodeMsg').className = 'msg';
    });
    $('btnBannerChange').addEventListener('click', () => $('btnChangeCode').click());
    $('btnBannerDismiss').addEventListener('click', () => {
      sessionStorage.setItem('material_change_banner_dismissed', '1');
      $('changeBanner').classList.remove('show');
    });
    $('btnChangeCancel').addEventListener('click', () => $('codeMask').classList.remove('show'));
    $('btnChangeSubmit').addEventListener('click', async () => {
      const newCode = $('newCodeInput').value.trim();
      const confirm = $('newCodeConfirm').value.trim();
      if (newCode !== confirm) {
        show($('changeCodeMsg'), '两次输入不一致', false);
        return;
      }
      try {
        const r = await fetch(`${API}/change-access-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Access-Code': accessCode },
          body: JSON.stringify({ accessCode, newCode }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '修改失败');
        accessCode = data.code || newCode;
        accessName = data.name || accessName;
        localStorage.setItem('material_request_code', accessCode);
        if (accessName) localStorage.setItem('material_request_name', accessName);
        $('codeMask').classList.remove('show');
        updateUserBar();
        show($('msg'), '口令已更新', true);
      } catch (e) {
        show($('changeCodeMsg'), e.message || String(e), false);
      }
    });

    document.querySelectorAll('.tabs button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('on'));
        btn.classList.add('on');
        document.querySelectorAll('.panel').forEach((p) => p.classList.remove('show'));
        $(btn.dataset.panel).classList.add('show');
        if (btn.dataset.panel === 'queryPanel') loadMyRecords();
      });
    });

    function materialStatusLabel(status) {
      return publicStatusText(status);
    }
    function fmtWhen(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      } catch {
        return String(iso);
      }
    }
    function itemsSummary(items) {
      return (items || [])
        .map((i) => `${i.name || ''}${i.spec ? ` ${i.spec}` : ''} ×${i.qty || ''}${i.unit || ''}`)
        .filter(Boolean)
        .join('；') || '—';
    }
    function renderRecordDetail(info) {
      const el = $('mineDetail');
      el.className = 'record-detail show';
      el.innerHTML = `
        <p><span class="badge ${esc(info.status)}">${esc(materialStatusLabel(info.status))}</span></p>
        <p><strong>编号：</strong>${esc(info.id)}</p>
        <p><strong>申请日期：</strong>${esc(info.applyDate || '—')}</p>
        <p><strong>物资：</strong>${esc(itemsSummary(info.items))}</p>
        ${info.purpose ? `<p><strong>用途：</strong>${esc(info.purpose)}</p>` : ''}
        ${info.rejectReason ? `<p><strong>驳回原因：</strong>${esc(info.rejectReason)}</p>` : ''}
        <p><strong>提交：</strong>${esc(fmtWhen(info.submittedAt))}</p>
        <p><strong>审批：</strong>${esc(fmtWhen(info.decidedAt))}</p>`;
    }
    function renderMineList(records) {
      const box = $('mineList');
      $('mineDetail').className = 'record-detail';
      if (!records.length) {
        box.innerHTML = '<div class="mine-empty">暂无申请记录<br>提交领用申请后将显示在此</div>';
        return;
      }
      box.innerHTML = records.map((r) => `
        <button type="button" class="mine-item" data-id="${esc(r.id)}">
          <div class="row1">
            <span>${esc(r.id)}</span>
            <span class="badge ${esc(r.status)}">${esc(materialStatusLabel(r.status))}</span>
          </div>
          <div class="row2">${esc(r.applyDate || '—')} · ${esc(itemsSummary(r.items).slice(0, 48))}${itemsSummary(r.items).length > 48 ? '…' : ''}</div>
        </button>`).join('');
      box.querySelectorAll('.mine-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          const rec = records.find((x) => String(x.id) === btn.dataset.id);
          if (rec) renderRecordDetail(rec);
        });
      });
    }
    async function loadMyRecords() {
      $('btnRefreshMine').disabled = true;
      show($('queryMsg'), '加载中…', true);
      try {
        let records = [];
        if (IS_PUBLIC) {
          const name = accessName || localStorage.getItem('material_request_name') || '';
          const stored = loadMyIdList();
          const list = await fetchPublicStatusMessages();
          const byId = new Map();
          for (const row of list) {
            const b = row.body;
            if (!b.id || String(b.id).startsWith('denied-')) continue;
            const matchName = name && b.accessName === name;
            const matchId = stored.some((s) => s.id === b.id);
            if (!matchName && !matchId) continue;
            if (b.accessName && !name) {
              accessName = b.accessName;
              localStorage.setItem('material_request_name', accessName);
              updateUserBar();
            }
            const prev = byId.get(b.id);
            if (!prev || row.time >= prev._t) byId.set(b.id, Object.assign({}, b, { _t: row.time }));
          }
          for (const s of stored) {
            if (!byId.has(s.id)) {
              byId.set(s.id, {
                id: s.id,
                status: 'pending',
                applyDate: s.applyDate,
                purpose: s.purpose,
                items: s.items,
                submittedAt: s.submittedAt,
              });
            }
          }
          records = [...byId.values()]
            .sort((a, b) => String(b.submittedAt || '').localeCompare(String(a.submittedAt || '')));
        } else {
          const qs = accessCode ? `?k=${encodeURIComponent(accessCode)}` : '';
          const r = await fetch(`${API}/my-records${qs}`, {
            headers: accessCode ? { 'X-Access-Code': accessCode } : {},
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || '加载失败');
          if (data.accessName) {
            accessName = data.accessName;
            localStorage.setItem('material_request_name', accessName);
            updateUserBar();
          }
          records = data.records || [];
        }
        renderMineList(records);
        show($('queryMsg'), records.length ? `共 ${records.length} 条申请` : '暂无申请记录', true);
      } catch (err) {
        $('mineList').innerHTML = '';
        show($('queryMsg'), err.message || String(err), false);
      } finally {
        $('btnRefreshMine').disabled = false;
      }
    }
    $('btnRefreshMine').addEventListener('click', loadMyRecords);
    $('btnGotoQuery').addEventListener('click', () => {
      document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('on'));
      document.querySelector('[data-panel="queryPanel"]').classList.add('on');
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('show'));
      $('queryPanel').classList.add('show');
      loadMyRecords();
    });

    $('btnAddRow').addEventListener('click', () => {
      const n = document.querySelectorAll('.item-row').length;
      $('itemsBox').insertAdjacentHTML('beforeend', itemTemplate(n));
      bindItemRow($('itemsBox').lastElementChild);
    });

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('btnSubmit');
      btn.disabled = true;
      $('okBox').classList.remove('show');
      try {
        const code = accessCode;
        if (!needAccessCode && !code) {
          /* 未启用口令时允许匿名提交 */
        } else if (needAccessCode && !code) {
          throw new Error('请先登录');
        }
        const items = collectItems();
        for (const it of items) {
          if (!it.code) throw new Error('请选择物资');
          const item = applyOptions.find((x) => x.code === it.code);
          if (!item) throw new Error('所选物资已不可申请，请刷新后重选');
          const qty = Number(it.qty);
          if (!Number.isFinite(qty) || qty < 1) throw new Error('请填写有效数量');
          if (qty > item.available) throw new Error(`${item.name} 申请数量超过可领用库存，请调整数量`);
        }
        if (IS_PUBLIC) {
          if (!CLOUD && !NTFY?.topic) throw new Error('公网收件未配置，请联系办公室');
          const clientToken = (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).slice(0, 16);
          const payload = {
            type: 'material_request',
            clientToken,
            accessCode: code,
            accessName: accessName || resolvePublicAccess(code)?.name || '',
            applyDate: $('applyDate').value,
            purpose: $('purpose').value.trim(),
            note: $('note').value.trim(),
            items,
            submittedAt: new Date().toISOString(),
          };
          show($('msg'), '正在提交…', true);
          let cloudOk = false;
          if (CLOUD) {
            try {
              const ctrl = new AbortController();
              const timer = setTimeout(() => ctrl.abort(), 8000);
              const cr = await fetch(`${CLOUD.baseUrl}/v1/submit/material`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify(payload),
                signal: ctrl.signal,
              });
              clearTimeout(timer);
              cloudOk = cr.ok;
            } catch (_) {
              cloudOk = false;
            }
          }
          if (NTFY?.topic) {
            fetch(`${NTFY.server}/${encodeURIComponent(NTFY.topic)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8', Title: 'Material request', Tags: 'material,office' },
              body: JSON.stringify(payload),
            }).catch(() => {});
          } else if (!cloudOk) {
            throw new Error('提交失败：当前网络无法连接云端，请联系办公室');
          }
          show($('msg'), '已送达，正在获取申请编号…', true);
          let assignedId = '';
          let deniedMsg = '';
          const deadline = Date.now() + 20000;
          while (Date.now() < deadline && !assignedId && !deniedMsg) {
            try {
              const found = await findPublicStatusByToken(clientToken);
              if (found && found.status === 'denied') deniedMsg = found.rejectReason || '申请被拒绝';
              else if (found && found.id && found.status !== 'denied') assignedId = String(found.id);
            } catch (_) { /* retry */ }
            if (!assignedId && !deniedMsg) await new Promise((x) => setTimeout(x, 1500));
          }
          if (deniedMsg) throw new Error(deniedMsg);
          if (!assignedId) {
            if (cloudOk) {
              show($('msg'), '已提交至云端队列，办公室开机后将分配编号。可在「查询进度」跟踪。', true);
              return;
            }
            if (NTFY?.topic) {
              show($('msg'), '已提交，办公室上线后将分配编号。可在「查询进度」查看。', true);
              return;
            }
            throw new Error('已提交，但暂未取到编号。请稍后在「查询进度」查看，或联系办公室。');
          }
          addMyId(assignedId, {
            applyDate: $('applyDate').value,
            purpose: $('purpose').value.trim(),
            items,
            submittedAt: new Date().toISOString(),
          });
          localStorage.setItem('material_last_id', assignedId);
          $('okId').textContent = assignedId;
          $('okBox').classList.add('show');
          show($('msg'), '提交成功', true);
          return;
        }
        const payload = {
          accessCode: code,
          k: code,
          applyDate: $('applyDate').value,
          purpose: $('purpose').value.trim(),
          note: $('note').value.trim(),
          items,
        };
        const r = await fetch(`${API}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '提交失败');
        $('okId').textContent = data.id || '';
        $('okBox').classList.add('show');
        show($('msg'), '提交成功', true);
        if (data.id) {
          addMyId(data.id, {
            applyDate: $('applyDate').value,
            purpose: $('purpose').value.trim(),
            items,
            submittedAt: new Date().toISOString(),
          });
        }
      } catch (err) {
        show($('msg'), err.message || String(err), false);
      } finally {
        updateSubmitButton();
      }
    });

    $('btnCopyId').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText($('okId').textContent.trim());
        show($('msg'), '编号已复制', true);
      } catch {
        show($('msg'), '复制失败，请长按编号手动复制', false);
      }
    });

    renderItems(1);
    loadMeta().catch((e) => show($('msg'), e.message, false));
  </script>
</body>
</html>
