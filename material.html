      const parts = ['<option value="">请选择物资</option>'];
      for (const opt of applyOptions) {
        const label = esc(optionLabel(opt));
        const sel = selectedCode && opt.code === selectedCode ? ' selected' : '';
        parts.push(
          `<option value="${esc(opt.code)}"${sel}`
          + ` data-name="${esc(opt.name)}"`
          + ` data-spec="${esc(opt.spec)}"`
          + ` data-unit="${esc(opt.unit)}"`
          + ` data-available="${opt.available}">${label}</option>`,
        );
      }
      return parts.join('');
    }

    function itemTemplate(idx) {
      return `<div class="item-row" data-idx="${idx}">
        <label><span class="field-label req">物资名称</span>
          <select data-f="pick" required>${buildPickOptions()}</select>
        </label>
        <div class="row3">
          <label><span class="field-label">规格</span><input data-f="spec" maxlength="120" readonly placeholder="选物资后自动带出" /></label>
          <label><span class="field-label">单位</span><input data-f="unit" maxlength="20" readonly placeholder="自动" /></label>
          <label><span class="field-label req">数量</span>
            <input data-f="qty" type="number" min="1" step="1" inputmode="numeric" placeholder="整数" />
            <span class="qty-err" data-qty-err></span>
          </label>
        </div>
        ${idx > 0 ? '<button type="button" class="btn-del" data-del>删除本行</button>' : ''}
      </div>`;
    }

    function getRowPick(row) {
      return row.querySelector('[data-f="pick"]');
    }

    function syncRowFromPick(row) {
      const pick = getRowPick(row);
      const specEl = row.querySelector('[data-f="spec"]');
      const unitEl = row.querySelector('[data-f="unit"]');
      const qtyEl = row.querySelector('[data-f="qty"]');
      const qtyErr = row.querySelector('[data-qty-err]');
      const opt = pick?.selectedOptions?.[0];
      const code = pick?.value || '';
      if (!code || !opt) {
        specEl.value = '';
        unitEl.value = '';
        row.dataset.available = '';
        row.dataset.code = '';
        row.dataset.name = '';
        validateRowQty(row);
        return;
      }
      const name = opt.dataset.name || '';
      const spec = opt.dataset.spec || '';
      const unit = opt.dataset.unit || '';
      const available = Number(opt.dataset.available || 0);
      specEl.value = spec;
      unitEl.value = unit;
      row.dataset.code = code;
      row.dataset.name = name;
      row.dataset.available = String(available);
      if (qtyEl?.max) qtyEl.max = String(Math.max(1, available));
      validateRowQty(row);
    }

    function validateRowQty(row) {
      const qtyEl = row.querySelector('[data-f="qty"]');
      const qtyErr = row.querySelector('[data-qty-err]');
      const available = Number(row.dataset.available || 0);
      const qty = Number(qtyEl?.value);
      let bad = false;
      if (row.dataset.code && qtyEl?.value !== '') {
        if (!Number.isFinite(qty) || qty < 1) {
          qtyErr.textContent = '请填写有效数量';
          qtyErr.classList.add('show');
          bad = true;
        } else if (available > 0 && qty > available) {
          qtyErr.textContent = '申请数量超出限制';
          qtyErr.classList.add('show');
          qtyEl.classList.add('qty-over');
          bad = true;
        } else {
          qtyErr.textContent = '';
          qtyErr.classList.remove('show');
          qtyEl.classList.remove('qty-over');
        }
      } else {
        qtyErr.textContent = '';
        qtyErr.classList.remove('show');
        qtyEl?.classList.remove('qty-over');
      }
      return !bad;
    }

    function getApplyDeptValue() {

    function updateSubmitButton() {
      const rows = [...document.querySelectorAll('.item-row')];
      const blocked = !getApplyDeptValue() || !applyOptions.length || rows.some((row) => {
        const code = row.dataset.code || getRowPick(row)?.value;
        const qty = Number(row.querySelector('[data-f="qty"]')?.value);
        if (!code || !Number.isFinite(qty) || qty < 1) return true;
        const available = Number(row.dataset.available || 0);
        if (available > 0 && qty > available) return true;
        return false;
      });
      $('btnSubmit').disabled = blocked;

    async function fetchPublicApplyOptions() {
      const embedded = (PUB.applyOptions || []).filter((o) => o && o.name);
      const sources = [];
      if (CLOUD?.baseUrl) sources.push(`${CLOUD.baseUrl}/v1/material-options`);
      if (PUB.optionsUrl) sources.push(PUB.optionsUrl);
      for (const url of sources) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (!r.ok) continue;
          const data = await r.json();
          const items = (data.items || []).filter((o) => o && o.name);
          if (items.length) return items;
        } catch {
          /* try next source */
        }
      }
      return embedded;
    }

          applyOptions = (data.items || []).filter((o) => o && o.name);

    function resolvePublicAccess(code) {
      const c = String(code || '').trim();
      if (!c) return null;
      return (PUB.accessCodes || []).find((row) => String(row.code || '').trim() === c) || null;
    }

    async function fetchPublicStatusMessages() {
      const url = `${NTFY.server}/${encodeURIComponent(NTFY.topic)}/json?poll=1&since=72h`;
      const r = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error('查询失败 HTTP ' + r.status);
      const text = (await r.text()).trim();
      if (!text) return [];
      const out = [];
      for (const line of text.split('\n')) {
        if (!line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }
        if (!msg || msg.event !== 'message') continue;
        let body = {};
        try { body = typeof msg.message === 'string' ? JSON.parse(msg.message) : (msg.message || {}); } catch { continue; }
        if (body.type !== 'material_status') continue;
        out.push({ body, time: Number(msg.time) || 0 });
      }
      return out;
    }

    async function findPublicStatusByTokenCloud(token) {
      if (!CLOUD) return null;
      const r = await fetch(`${CLOUD.baseUrl}/v1/status/${encodeURIComponent(token)}`, {
        headers: { Accept: 'application/json' },
      });
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('云端查询失败 HTTP ' + r.status);
      const j = await r.json();
      if (!j.found) return null;
      return {
        id: j.id,
        clientToken: j.clientToken,
        status: j.status,
        rejectReason: j.rejectReason || '',
      };
    }

    async function findPublicStatusByToken(token) {
      try {
        const cloud = await findPublicStatusByTokenCloud(token);
        if (cloud) return cloud;
      } catch (_) { /* fallback ntfy */ }
      const list = await fetchPublicStatusMessages();
      let best = null;
      for (const row of list) {
        if (String(row.body.clientToken || '') !== String(token)) continue;
        if (!best || row.time >= best._t) best = Object.assign({}, row.body, { _t: row.time });
      }
      return best;
    }

        applyDept: meta.applyDept || '',
        purpose: meta.purpose || '',

    async function unlockWithCode(code) {
      const c = String(code || '').trim();
      if (!c) {
        showGateMsg(false, '请填写登记口令');
        return false;
      }
      const btn = $('btnUnlock');
      btn.disabled = true;
      showGateMsg(true, '正在验证…');
      try {
        if (IS_PUBLIC) {
          const row = resolvePublicAccess(c);
          if (!row) throw new Error('口令无效');
          accessCode = c;
          accessName = row.name || '';
          localStorage.setItem('material_request_code', c);
          if (accessName) localStorage.setItem('material_request_name', accessName);
          enterApp();
          return true;
        }
        const r = await fetch(`${API}/session?k=${encodeURIComponent(c)}`, {
          headers: { 'X-Access-Code': c },
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '口令无效');
        accessCode = c;
        accessName = data.name || '';
        localStorage.setItem('material_request_code', c);
        if (accessName) localStorage.setItem('material_request_name', accessName);
        enterApp();
        maybeShowChangeBanner(data.shouldPromptChangeCode);
        return true;
      } catch (e) {
        showGateMsg(false, e.message || '口令无效');
        return false;
      } finally {
        btn.disabled = false;
      }
    }

    function materialStatusLabel(status) {

    function fmtWhen(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      } catch {
        return String(iso);
      }
    }
    function itemsSummary(items) {

    async function loadMyRecords() {
      $('btnRefreshMine').disabled = true;
      show($('queryMsg'), '…', true);
      try {
        let records = [];
        if (IS_PUBLIC) {
          const name = accessName || localStorage.getItem('material_request_name') || '';
          const stored = loadMyIdList();
          const list = await fetchPublicStatusMessages();
          const byId = new Map();
          for (const row of list) {
            const b = row.body;
            if (!b.id || String(b.id).startsWith('denied-')) continue;
            const matchName = name && b.accessName === name;
            const matchId = stored.some((s) => s.id === b.id);
            if (!matchName && !matchId) continue;
            if (b.accessName && !name) {
              accessName = b.accessName;
              localStorage.setItem('material_request_name', accessName);
              updateUserBar();
            }
            const prev = byId.get(b.id);
            if (!prev || row.time >= prev._t) byId.set(b.id, Object.assign({}, b, { _t: row.time }));
          }
          for (const s of stored) {
            if (!byId.has(s.id)) {
              byId.set(s.id, {
                id: s.id,
                status: 'pending',
                applyDate: s.applyDate,
                applyDept: s.applyDept,
                purpose: s.purpose,
                items: s.items,
                submittedAt: s.submittedAt,
              });
            }
          }
          records = [...byId.values()]
            .sort((a, b) => String(b.submittedAt || '').localeCompare(String(a.submittedAt || '')));
        } else {
          const qs = accessCode ? `?k=${encodeURIComponent(accessCode)}` : '';
          const r = await fetch(`${API}/my-records${qs}`, {
            headers: accessCode ? { 'X-Access-Code': accessCode } : {},
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || '加载失败');
          if (data.accessName) {
            accessName = data.accessName;
            localStorage.setItem('material_request_name', accessName);
            updateUserBar();
          }
          records = data.records || [];
        }
        renderMineList(records);
        show($('queryMsg'), records.length ? `共 ${records.length} 条申请` : '暂无申请记录', true);
      } catch (err) {
        $('mineList').innerHTML = '';
        show($('queryMsg'), err.message || String(err), false);
      } finally {
        $('btnRefreshMine').disabled = false;
      }
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('btnSubmit');
      btn.disabled = true;
      $('okBox').classList.remove('show');
      try {
        const code = accessCode;
        if (!needAccessCode && !code) {
          /* 未启用口令时允许匿名提交 */
        } else if (needAccessCode && !code) {
          throw new Error('请先登录');
        }
        const applyDept = getApplyDeptValue();
        if (!applyDept) throw new Error('请选择申请部门');
        const items = collectItems();
        for (const it of items) {
          if (!it.code || !it.name) throw new Error('请选择物资名称');
          const qty = Number(it.qty);
          if (!Number.isFinite(qty) || qty < 1) throw new Error('请填写有效数量');
          const opt = applyOptions.find((o) => o.code === it.code);
          if (opt && qty > opt.available) throw new Error(`${it.name} 申请数量超出限制`);
        }
        if (IS_PUBLIC) {
          if (!CLOUD && !NTFY?.topic) throw new Error('公网收件未配置，请联系办公室');
          const clientToken = (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).slice(0, 16);
          const payload = {
            type: 'material_request',
            clientToken,
            accessCode: code,
            accessName: accessName || resolvePublicAccess(code)?.name || '',
            applyDate: $('applyDate').value,
            applyDept,
            purpose: $('purpose').value.trim(),
            note: '',
            items,
            submittedAt: new Date().toISOString(),
          };
          show($('msg'), '正在提交…', true);
          let cloudOk = false;
          if (CLOUD) {
            try {
              const ctrl = new AbortController();
              const timer = setTimeout(() => ctrl.abort(), 8000);
              const cr = await fetch(`${CLOUD.baseUrl}/v1/submit/material`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify(payload),
                signal: ctrl.signal,
              });
              clearTimeout(timer);
              cloudOk = cr.ok;
            } catch (_) {
              cloudOk = false;
            }
          }
          if (NTFY?.topic) {
            fetch(`${NTFY.server}/${encodeURIComponent(NTFY.topic)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8', Title: 'Material request', Tags: 'material,office' },
              body: JSON.stringify(payload),
            }).catch(() => {});
          } else if (!cloudOk) {
            throw new Error('提交失败：当前网络无法连接云端，请联系办公室');
          }
          show($('msg'), '已送达，正在获取申请编号…', true);
          let assignedId = '';
          let deniedMsg = '';
          const deadline = Date.now() + 20000;
          while (Date.now() < deadline && !assignedId && !deniedMsg) {
            try {
              const found = await findPublicStatusByToken(clientToken);
              if (found && found.status === 'denied') deniedMsg = found.rejectReason || '申请被拒绝';
              else if (found && found.id && found.status !== 'denied') assignedId = String(found.id);
            } catch (_) { /* retry */ }
            if (!assignedId && !deniedMsg) await new Promise((x) => setTimeout(x, 1500));
          }
          if (deniedMsg) throw new Error(deniedMsg);
          if (!assignedId) {
            if (cloudOk) {
              show($('msg'), '已提交至云端队列，办公室开机后将分配编号。可在「查询进度」跟踪。', true);
              return;
            }
            if (NTFY?.topic) {
              show($('msg'), '已提交，办公室上线后将分配编号。可在「查询进度」查看。', true);
              return;
            }
            throw new Error('已提交，但暂未取到编号。请稍后在「查询进度」查看，或联系办公室。');
          }
          addMyId(assignedId, {
            applyDate: $('applyDate').value,
            applyDept,
            purpose: $('purpose').value.trim(),
            items,
            submittedAt: new Date().toISOString(),
          });
          localStorage.setItem('material_last_id', assignedId);
          $('okId').textContent = assignedId;
          $('okBox').classList.add('show');
          show($('msg'), '提交成功', true);
          return;
        }
        const payload = {
          accessCode: code,
          k: code,
          applyDate: $('applyDate').value,
          applyDept,
          purpose: $('purpose').value.trim(),
          note: '',
          items,
        };
        const r = await fetch(`${API}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '提交失败');
        $('okId').textContent = data.id || '';
        $('okBox').classList.add('show');
        show($('msg'), '提交成功', true);
        if (data.id) {
          addMyId(data.id, {
            applyDate: $('applyDate').value,
            applyDept,
            purpose: $('purpose').value.trim(),
            items,
            submittedAt: new Date().toISOString(),
          });
        }
      } catch (err) {
        show($('msg'), err.message || String(err), false);
      } finally {
        updateSubmitButton();
      }
    });

    $('btnCopyId').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText($('okId').textContent.trim());
        show($('msg'), '编号已复制', true);
      } catch {
        show($('msg'), '复制失败，请长按编号手动复制', false);
      }
    });

    $('applyDept')?.addEventListener('change', updateSubmitButton);

    async function boot() {
      $('applyDate').value = new Date().toISOString().slice(0, 10);
      await loadMeta();
      await loadApplyOptions();
      updateSubmitButton();
    }
    boot().catch((e) => show($('msg'), e.message, false));
  </script>
</body>
</html>
