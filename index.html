<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="十八局南方公司出车登记" />
  <meta name="robots" content="noindex, nofollow" />
  <title>十八局南方公司出车登记</title>
  <link rel="preload" href="./assets/office-ui-core.css" as="style" />
  <link rel="stylesheet" href="./assets/office-ui-core.css" />
  <link rel="stylesheet" href="./assets/office-ui-apple.css" />
  <script src="./assets/office-icons.js" defer></script>
  <script src="./assets/office-date.js" defer></script>
  <script src="./assets/office-escape.js" defer></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #fff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, 0.08);
      --brand: #1d1d1f;
      --brand2: #424245;
      --ok: #1b7a4e;
      --danger: #b42318;
      --radius: 14px;
      --shadow: 0 8px 28px rgba(31, 78, 121, 0.08);
      --inline-input-h: 44px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .wrap { max-width: 440px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 18px;
    }
    .brand {
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--brand);
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.45;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 750;
      letter-spacing: 0.02em;
    }
    form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px 20px;
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .field-label {
      display: block;
      height: 20px;
      line-height: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .field-label.req::after,
    .req::after { content: " *"; color: var(--danger); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 12px;
      font-size: 16px;
      font-family: inherit;
      color: var(--ink);
      background: #fbfcfe;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid rgba(31, 78, 121, 0.25);
      border-color: var(--brand2);
      background: #fff;
    }
    textarea { min-height: 72px; resize: vertical; }
    .split-6-4 {
      display: grid;
      gap: 12px;
    }
    .split-row,
    .row2 {
      display: grid;
      grid-template-columns: 6fr 4fr;
      gap: 12px;
      align-items: stretch;
    }
    .split-row > label,
    .row2 > label {
      display: grid;
      grid-template-rows: 20px 44px;
      gap: 6px;
      min-width: 0;
      margin: 0;
    }
    .split-row > label > input:not([type="file"]),
    .split-row > label > select,
    .row2 > label > input,
    .row2 > label > select {
      height: 44px;
      min-height: 44px;
      padding: 10px 12px;
      box-sizing: border-box;
    }
    .split-row.mileage-row-short {
      grid-template-columns: 1fr;
    }
    .field-inline {
      display: grid;
      grid-template-columns: 3.5em 1fr;
      gap: 8px 10px;
      align-items: center;
      min-width: 0;
    }
    .inline-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      line-height: 20px;
      flex-shrink: 0;
    }
    .field-inline input {
      height: var(--inline-input-h);
      min-height: var(--inline-input-h);
      padding: 10px 12px;
      box-sizing: border-box;
      min-width: 0;
    }
    .photo-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      align-items: start;
    }
    .photo-field {
      min-width: 0;
    }
    .photo-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.35;
      text-align: center;
    }
    .photo-add-wrap {
      position: relative;
      width: 100%;
    }
    .photo-add-box {
      width: 100%;
      height: calc(var(--inline-input-h) * 2);
      min-height: calc(var(--inline-input-h) * 2);
      border: 1px dashed rgba(0, 0, 0, 0.14);
      border-radius: 10px;
      background: #f8fafc;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      padding: 8px 10px;
      margin: 0;
      font-family: inherit;
      font-weight: 600;
      box-sizing: border-box;
    }
    .photo-add-box:active { background: #eef3f8; }
    .photo-box-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      z-index: 1;
      pointer-events: none;
      max-width: 100%;
    }
    .photo-add-box .preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: cover;
      border: 0;
      border-radius: 10px;
      margin: 0;
    }
    .photo-add-box.has-photo .photo-box-inner { display: none; }
    .photo-add-text {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      pointer-events: none;
    }
    .photo-menu {
      display: none;
      position: absolute;
      left: 0;
      top: calc(100% + 4px);
      z-index: 12;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      min-width: 100%;
      overflow: hidden;
    }
    .photo-menu.show { display: grid; }
    .photo-menu-btn {
      appearance: none;
      border: 0;
      background: #fff;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      width: 100%;
      margin: 0;
    }
    .photo-menu-btn:active { background: #eef3f8; }
    .photo-menu-btn + .photo-menu-btn {
      border-top: 1px solid var(--line);
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      cursor: pointer;
      margin-top: 4px;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg.show { display: block; }
    .msg.ok { background: #e8f6ee; color: var(--ok); border: 1px solid #b7e0c7; }
    .msg.err { background: #fdecec; color: var(--danger); border: 1px solid #f3c1bd; }
    input[type="file"].file-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
      opacity: 0;
    }
    .pick-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pick-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 650;
      color: var(--brand);
      cursor: pointer;
      font-family: inherit;
    }
    .pick-btn:active { background: #eef3f8; }
    .preview {
      display: none;
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      margin-top: 4px;
    }
    .preview.show { display: block; }
    .hint {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin: 0;
    }
    .ft {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .toplinks { margin-top: 8px; font-size: 13px; }
    .toplinks a { color: var(--brand); font-weight: 650; }
    .ok-box {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #b7e4c7;
      background: #edf9f1;
      font-size: 13px;
      line-height: 1.5;
      color: var(--ok);
    }
    .ok-box.show { display: block; }
    .ok-box code {
      display: block;
      margin: 8px 0;
      padding: 8px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12px;
      word-break: break-all;
      font-family: ui-monospace, Consolas, monospace;
    }
    .ok-box .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .ok-box .acts button {
      flex: 1;
      min-width: 110px;
      border: 0;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      cursor: pointer;
      background: var(--brand);
      color: #fff;
    }
    .ok-box .acts button.sec { background: #e8eef5; color: var(--brand); }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 14px;
    }
    .tabs button {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }
    .tabs button.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .panel-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 18px 16px 20px;
    }
    .query-result {
      display: none;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #f8fafc;
      font-size: 14px;
    }
    .query-result.show { display: block; }
    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 750;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .badge.pending { background: #ffe6a8; color: #b45309; }
    .badge.approved { background: #d8f3e4; color: var(--ok); }
    .badge.rejected { background: #fde2e0; color: var(--danger); }
    .qgrid { display: grid; gap: 8px; }
    .qgrid div { display: flex; justify-content: space-between; gap: 12px; }
    .qgrid b { color: var(--muted); font-weight: 650; flex-shrink: 0; }
    .gate-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 18px 16px 20px;
      display: grid;
      gap: 12px;
    }
    .user-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-size: 14px;
    }
    .user-bar.show { display: flex; }
    .user-bar .name { font-weight: 700; color: var(--brand); }
    .btn-logout {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 650;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      margin: 0;
    }
    .mine-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .mine-toolbar button {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 650;
      color: var(--brand);
      cursor: pointer;
      font-family: inherit;
      margin: 0;
    }
    .mine-list { display: grid; gap: 8px; }
    .mine-item {
      display: grid;
      gap: 4px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fafc;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      width: 100%;
    }
    .mine-item:active { background: #eef3f8; }
    .mine-item .row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }
    .mine-item .row2 {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .user-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-change-code {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 650;
      color: var(--brand);
      cursor: pointer;
      font-family: inherit;
      margin: 0;
    }
    .change-banner {
      display: none;
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #b7d4f0;
      background: #eef6fc;
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink);
    }
    .change-banner.show { display: block; }
    .change-banner .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .change-banner button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      font-family: inherit;
      margin: 0;
    }
    .change-banner .primary { background: var(--brand); color: #fff; }
    .change-banner .ghost { background: #fff; color: var(--muted); border: 1px solid var(--line); }
    .code-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .code-mask.show { display: flex; }
    .code-dialog {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 18px 16px 16px;
      display: grid;
      gap: 12px;
    }
    .code-dialog h2 { margin: 0; font-size: 18px; }
    .code-dialog label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .code-dialog input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
    }
    .code-dialog .hint { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.45; }
    .code-dialog .acts { display: flex; gap: 8px; }
    .code-dialog .acts button {
      flex: 1;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin: 0;
    }
    .code-dialog .acts .primary { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; }
    .code-dialog .acts .ghost { background: #eef2f6; color: var(--ink); }

    .mine-empty {
      text-align: center;
      padding: 24px 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      h1 { font-size: 22px; }
      .brand { font-size: 12px; }
      form, .panel-card, .gate-card { padding: 16px 14px 18px; }
      .preview { max-height: 180px; }
      .split-row,
      .row2 {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .split-row > label,
      .row2 > label {
        grid-template-rows: auto auto;
      }
      .photo-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }
  </style>
</head>
<body class="register-page">
  <div class="wrap">
    <header>
      <h1>十八局南方公司出车登记</h1>
    </header>

    <div class="gate-card" id="gateBox" style="display:none">
      <label><span class="req">登记口令</span>
        <input id="accessCodeInput" autocomplete="off" spellcheck="false" placeholder="个人口令" />
      </label>
      <button type="button" id="btnUnlock" style="width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));cursor:pointer">登录</button>
      <div class="msg" id="gateMsg"></div>
    </div>

    <div id="appMain" style="display:none">
    <div class="user-bar" id="userBar">
      <span class="name" id="userGreeting">您好</span>
      <div class="user-actions">
        <button type="button" class="btn-change-code" id="btnChangeCode">修改口令</button>
        <button type="button" class="btn-logout" id="btnLogout">退出</button>
      </div>
    </div>
    <div class="change-banner" id="changeBanner">
      <div>建议尽快修改个人登记口令，仅自己知道更安全。</div>
      <div class="acts">
        <button type="button" class="primary" id="btnBannerChange">去修改</button>
        <button type="button" class="ghost" id="btnBannerDismiss">知道了</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="active" id="tabReg" data-panel="panelReg">出车登记</button>
      <button type="button" id="tabMine" data-panel="panelMine">查询进度</button>
    </div>

    <div class="panel active" id="panelReg">
    <form id="form" autocomplete="on">
      <div class="split-6-4">
        <div class="split-row">
          <label><span class="field-label req">日期</span>
            <input type="date" name="date" id="date" required />
          </label>
          <label><span class="field-label req">车牌号码</span>
            <select name="plate" id="plate" required>
              <option value="">请选择</option>
            </select>
          </label>
        </div>
        <div class="split-row">
          <label><span class="field-label">出发时间</span>
            <input type="time" name="departTime" id="departTime" />
          </label>
          <label><span class="field-label req">出发表显里程</span>
            <input type="number" name="departOdometer" id="departOdometer" required min="0" step="0.1" inputmode="decimal" placeholder="公里" />
          </label>
        </div>
        <div class="split-row">
          <label><span class="field-label">返回时间</span>
            <input type="time" name="returnTime" id="returnTime" />
          </label>
          <label id="returnOdoWrap"><span class="field-label req" id="returnOdoReq">返程表显里程</span>
            <input type="number" name="returnOdometer" id="returnOdometer" required min="0" step="0.1" inputmode="decimal" placeholder="公里" />
          </label>
        </div>
        <div class="split-row">
          <label><span class="field-label">出车总时长</span>
            <input id="durationText" readonly tabindex="-1" placeholder="自动计算" />
          </label>
          <label id="mileageWrap"><span class="field-label">行驶里程（公里）</span>
            <input type="number" name="mileage" id="mileage" readonly tabindex="-1" placeholder="自动计算" />
          </label>
        </div>
      </div>
      <div class="row2">
        <label><span class="field-label req">司机</span>
          <input name="driver" id="driver" required maxlength="40" placeholder="姓名" />
        </label>
        <label><span class="field-label req">经办人</span>
          <select name="handler" id="handler" required>
            <option value="">请选择</option>
          </select>
        </label>
      </div>
      <div class="field-inline">
        <span class="inline-label req">事&nbsp;&nbsp;由</span>
        <input type="text" name="purpose" id="purpose" required list="purposeOptions" maxlength="200" placeholder="选择或填写" autocomplete="off" />
      </div>
      <datalist id="purposeOptions">
        <option value="短程出车"></option>
        <option value="接送客人"></option>
        <option value="公务出行"></option>
      </datalist>
      <div class="field-inline">
        <span class="inline-label req">出发地</span>
        <input name="origin" id="origin" required maxlength="200" placeholder="如：公司" />
      </div>
      <div class="field-inline" id="destWrap">
        <span class="inline-label req" id="destReq">目的地</span>
        <input name="destination" id="destination" required maxlength="200" placeholder="如：机场；短程可不填" />
      </div>
      <div class="photo-row" id="photoRow">
        <div class="photo-field" id="photoBlock">

    async function fetchPublicStatusMessages() {
      const url = `${NTFY.server}/${encodeURIComponent(NTFY.topic)}/json?poll=1&since=72h`;
      const r = await fetch(url, { headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error('查询失败 HTTP ' + r.status);
      const text = (await r.text()).trim();
      if (!text) return [];
      const out = [];
      for (const line of text.split('\n')) {
        if (!line.trim()) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }
        if (!msg || msg.event !== 'message') continue;
        let body = {};
        try { body = typeof msg.message === 'string' ? JSON.parse(msg.message) : (msg.message || {}); } catch { continue; }
        if (body.type !== 'trip_status') continue;
        out.push({ body, time: Number(msg.time) || 0 });
      }
      return out;
    }
    async function findStatusByTokenCloud(token) {
      if (!CLOUD) return null;
      const r = await fetch(`${CLOUD.baseUrl}/v1/status/${encodeURIComponent(token)}`, {
        headers: { Accept: 'application/json' },
      });
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('云端查询失败 HTTP ' + r.status);
      const j = await r.json();
      if (!j.found) return null;
      return {
        id: j.id,
        clientToken: j.clientToken,
        status: j.status,
        rejectReason: j.rejectReason || '',
        accessName: j.payload?.accessName || '',
      };
    }
    async function findStatusByToken(token) {
      try {
        const cloud = await findStatusByTokenCloud(token);
        if (cloud) return cloud;
      } catch (_) { /* fallback ntfy */ }
      const list = await fetchPublicStatusMessages();
      let best = null;
      for (const row of list) {
        if (String(row.body.clientToken || '') !== String(token)) continue;
        if (!best || row.time >= best._t) best = Object.assign({}, row.body, { _t: row.time });
      }
      return best;
    }

          method: 'POST',
          headers: { 'Content-Type': 'image/jpeg', 'X-Access-Code': code },
          body: blob,

        if (!r.ok) throw new Error('照片上传失败 HTTP ' + r.status);
        const j = await r.json();
        if (!j.url) throw new Error('未取得照片链接');

        clearTimeout(timer);

    function recalcMileage() {
      const a = Number($('departOdometer').value);

    function formatDuration(mins) {
      if (mins == null || !Number.isFinite(mins) || mins < 0) return '';
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h && m) return `${h}小时${m}分钟`;
      if (h) return `${h}小时`;
      return `${m}分钟`;
    }
    function recalcDuration() {
      const a = $('departTime').value;
      const b = $('returnTime').value;
      if (!a || !b) { $('durationText').value = ''; return; }
      const parse = (t) => {
        const p = t.split(':').map(Number);
        return p[0] * 60 + p[1];
      };
      let x = parse(a), y = parse(b);
      if (y < x) y += 24 * 60;
      $('durationText').value = formatDuration(y - x);
    }

    function compressImage(file, maxSide = 1600, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.width;
          let h = img.height;
          if (w > maxSide || h > maxSide) {
            if (w >= h) { h = Math.round((h * maxSide) / w); w = maxSide; }
            else { w = Math.round((w * maxSide) / h); h = maxSide; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            if (!blob) reject(new Error('图片压缩失败'));
            else resolve(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('无法读取该图片（若为 HEIC，请改用 JPG/PNG，或点「拍照」重拍）'));
        };
        img.src = url;
      });
    }
    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = () => reject(new Error('读取图片失败'));
        fr.readAsDataURL(blob);
      });
    }

      const purpose = resolvePurpose();
      if (!purpose) {
        show('err', '请填写事由');
        btn.disabled = false;
        return;
      }
      const short = purpose === '短程出车';
      const f1 = $('photoDepart').files && $('photoDepart').files[0];
      const f2 = $('photoReturn').files && $('photoReturn').files[0];
      if (!short && (!f1 || !f2)) {
        show('err', '请上传出发与返程表显照片');
        btn.disabled = false;
        return;
      }
      if ((f1 && !f2) || (!f1 && f2)) {
        show('err', '表显照片请成对上传，或全部不传');
        btn.disabled = false;
        return;
      }
      try {
        if (IS_PUBLIC) {
          if (!CLOUD && !NTFY?.topic) throw new Error('公网收件未配置，请联系办公室');
          let photoDepartUrl = '';
          let photoReturnUrl = '';
          if (f1 && f2) {
            show('ok', '正在压缩照片…');
            const [b1, b2] = await Promise.all([compressImage(f1), compressImage(f2)]);
            const stamp = Date.now().toString(36);
            show('ok', '正在上传照片…');
            if (CLOUD) {
              try {
                [photoDepartUrl, photoReturnUrl] = await Promise.all([
                  uploadPhotoCloud(b1, 'depart'),
                  uploadPhotoCloud(b2, 'return'),
                ]);
              } catch (_) {
                if (!NTFY?.topic) throw new Error('照片上传失败，请稍后重试或联系办公室');
                [photoDepartUrl, photoReturnUrl] = await Promise.all([
                  uploadPhotoNtfy(b1, `depart-${stamp}.jpg`),
                  uploadPhotoNtfy(b2, `return-${stamp}.jpg`),
                ]);
              }
            } else {
              [photoDepartUrl, photoReturnUrl] = await Promise.all([
                uploadPhotoNtfy(b1, `depart-${stamp}.jpg`),
                uploadPhotoNtfy(b2, `return-${stamp}.jpg`),
              ]);
            }
          }
          const clientToken = (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).slice(0, 16);
          const payload = {
            type: 'trip_request',
            clientToken,
            accessCode: accessCode || localStorage.getItem('trip_access_code') || '',
            date: $('date').value,
            plate: $('plate').value,
            driver: $('driver').value.trim(),
            handler: $('handler').value,
            purpose,
            origin: $('origin').value.trim(),
            destination: $('destination').value.trim(),
            departTime: $('departTime').value,
            returnTime: $('returnTime').value,
            durationText: $('durationText').value,
            departOdometer: $('departOdometer').value,
            returnOdometer: $('returnOdometer').value,
            mileage: $('mileage').value,
            submittedAt: new Date().toISOString(),
          };
          if (!payload.accessCode && needAccessCode) throw new Error('缺少登记口令，请返回重新登录');
          if (photoDepartUrl) payload.photoDepartUrl = photoDepartUrl;
          if (photoReturnUrl) payload.photoReturnUrl = photoReturnUrl;
          show('ok', '正在提交申请…');
          $('okBox').classList.remove('show');
          let cloudOk = false;
          if (CLOUD) {
            try {
              const ctrl = new AbortController();
              const timer = setTimeout(() => ctrl.abort(), 8000);
              const cr = await fetch(`${CLOUD.baseUrl}/v1/submit/trip`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify(payload),
                signal: ctrl.signal,
              });
              clearTimeout(timer);
              cloudOk = cr.ok;
            } catch (_) {
              cloudOk = false;
            }
          }
          if (NTFY?.topic) {
            fetch(`${NTFY.server}/${encodeURIComponent(NTFY.topic)}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json; charset=utf-8',
                Title: 'Trip request',
                Tags: 'car,office',
              },
              body: JSON.stringify(payload),
            }).catch(() => {});
          } else if (!cloudOk) {
            throw new Error('提交失败：当前网络无法连接云端，请联系办公室');
          }
          show('ok', '已送达，正在获取申请编号…');
          let assignedId = '';
          let deniedMsg = '';
          const deadline = Date.now() + 20000;
          while (Date.now() < deadline && !assignedId && !deniedMsg) {
            try {
              const found = await findStatusByToken(clientToken);
              if (found && found.status === 'denied') deniedMsg = found.rejectReason || '登记被拒绝';
              else if (found && found.id && found.status !== 'denied') assignedId = String(found.id);
            } catch (_) { /* retry */ }
            if (!assignedId && !deniedMsg) await new Promise((x) => setTimeout(x, 1500));
          }
          localStorage.setItem('trip_driver', payload.driver);
          localStorage.setItem('trip_plate', payload.plate);
          localStorage.setItem('trip_handler', payload.handler);
          localStorage.setItem('trip_cool_until', String(Date.now() + 60 * 1000));
          if (deniedMsg) {
            show('err', deniedMsg);
          } else if (assignedId) {
            const found = await findStatusByToken(clientToken).catch(() => null);
            if (found && found.accessName) {
              accessName = found.accessName;
              localStorage.setItem('trip_access_name', accessName);
              updateUserBar();
            }
            addMyId(assignedId, {
              date: payload.date,
              plate: payload.plate,
              purpose: payload.purpose,
              submittedAt: payload.submittedAt,
            });
            localStorage.setItem('trip_last_id', assignedId);
            $('okId').textContent = assignedId;
            $('okBox').classList.add('show');
            show('ok', '提交成功');
          } else {
            if (cloudOk) {
              show('ok', '已提交至云端队列，办公室开机后将分配编号。可在「查询进度」跟踪。');
            } else if (NTFY?.topic) {
              show('ok', '已提交，办公室上线后将分配编号。可在「查询进度」查看。');
            } else {
              show('err', '已提交，但暂未取到编号。请稍后在「查询进度」查看，或联系办公室。');
            }
          }
        } else {
        let photoDepart = '';
        let photoReturn = '';
        if (f1 && f2) {
          show('ok', '正在压缩照片…');
          const [b1, b2] = await Promise.all([compressImage(f1), compressImage(f2)]);
          [photoDepart, photoReturn] = await Promise.all([blobToDataUrl(b1), blobToDataUrl(b2)]);
        }
        const payload = {
          accessCode: accessCode || localStorage.getItem('trip_access_code') || '',
          date: $('date').value,
          plate: $('plate').value,
          driver: $('driver').value.trim(),
          handler: $('handler').value,
          purpose,
          origin: $('origin').value.trim(),
          destination: $('destination').value.trim(),
          departTime: $('departTime').value,
          returnTime: $('returnTime').value,
          durationText: $('durationText').value,
          departOdometer: $('departOdometer').value,
          returnOdometer: $('returnOdometer').value,
          mileage: $('mileage').value,
          k: accessCode || new URLSearchParams(location.search).get('k') || '',
        };
        if (photoDepart) payload.photoDepart = photoDepart;
        if (photoReturn) payload.photoReturn = photoReturn;
        show('ok', '正在提交…');
        $('okBox').classList.remove('show');
        const r = await fetch(`${VEHICLE_API}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '提交失败');
        if (data.accessName) {
          accessName = data.accessName;
          localStorage.setItem('trip_access_name', accessName);
          updateUserBar();
        }
        localStorage.setItem('trip_driver', payload.driver);
        localStorage.setItem('trip_plate', payload.plate);
        localStorage.setItem('trip_handler', payload.handler);
        localStorage.setItem('trip_cool_until', String(Date.now() + 60 * 1000));
        localStorage.setItem('trip_last_id', data.id || '');
        $('okId').textContent = data.id || '';
        $('okBox').classList.add('show');
        show('ok', '提交成功');
        }
        $('purpose').value = '';
        $('origin').value = '';
        $('destination').value = '';
        $('departTime').value = '';
        $('returnTime').value = '';
        $('durationText').value = '';
        $('departOdometer').value = '';
        $('returnOdometer').value = '';
        $('mileage').value = '';
        $('photoDepart').value = '';
        $('photoReturn').value = '';
        $('previewDepart').classList.remove('show');
        $('previewReturn').classList.remove('show');
        $('photoDepartBox').classList.remove('has-photo');
        $('photoReturnBox').classList.remove('has-photo');
        closePhotoMenus();
        applyPurposeRules();
      } catch (err) {
        show('err', err.message || String(err));
      } finally {
        btn.disabled = false;
      }
    });

    $('btnCopyId').addEventListener('click', async () => {
      const id = $('okId').textContent.trim();
      try {
        await navigator.clipboard.writeText(id);
        show('ok', '编号已复制');
      } catch {
        show('err', '复制失败，请长按编号手动复制');
      }
    });

    function switchPanel(panelId) {
      document.querySelectorAll('.panel').forEach((el) => el.classList.toggle('active', el.id === panelId));
      document.querySelectorAll('.tabs button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.panel === panelId);
      });
      if (panelId === 'panelMine') loadMyRecords();
    }
    document.querySelectorAll('.tabs button').forEach((btn) => {
      btn.addEventListener('click', () => switchPanel(btn.dataset.panel));
    });

    function showMineMsg(type, text) {
      const el = $('mineMsg');
      el.className = 'msg show ' + type;
      el.textContent = text;
    }
    function statusLabel(s) {
      return ({ pending: '待审批', approved: '已同意登记', rejected: '已驳回' })[s] || s;
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }
    function fmtWhen(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      } catch {
        return String(iso);
      }
    }
    function renderRecordDetail(info, targetId) {
      const el = $(targetId);
      el.className = 'query-result show';
      el.innerHTML = `
        <span class="badge ${info.status}">${statusLabel(info.status)}</span>
        <div class="qgrid">
          <div><b>编号</b><span>${esc(info.id)}</span></div>
          <div><b>日期</b><span>${esc(info.date || '—')}</span></div>
          <div><b>车牌</b><span>${esc(info.plate || '—')}</span></div>
          <div><b>司机</b><span>${esc(info.driver || '—')}</span></div>
          <div><b>事由</b><span>${esc(info.purpose || '—')}</span></div>
          ${info.rejectReason ? `<div><b>驳回原因</b><span>${esc(info.rejectReason)}</span></div>` : ''}
          <div><b>提交</b><span>${esc(fmtWhen(info.submittedAt))}</span></div>
          <div><b>审批</b><span>${esc(fmtWhen(info.decidedAt))}</span></div>
        </div>`;
    }
    function renderMineList(records) {
      const box = $('mineList');
      $('mineDetail').className = 'query-result';
      if (!records.length) {
        box.innerHTML = '<div class="mine-empty">暂无申请记录<br>提交出车登记后将显示在此</div>';
        return;
      }
      box.innerHTML = records.map((r) => `
        <button type="button" class="mine-item" data-id="${esc(r.id)}">
          <div class="row1">
            <span>${esc(r.id)}</span>
            <span class="badge ${esc(r.status)}">${statusLabel(r.status)}</span>
          </div>
          <div class="row2">${esc(r.date || '—')} · ${esc(r.plate || '—')} · ${esc(r.purpose || '—')}</div>
        </button>`).join('');
      box.querySelectorAll('.mine-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          const rec = records.find((x) => String(x.id) === btn.dataset.id);
          if (rec) renderRecordDetail(rec, 'mineDetail');
        });
      });
    }
    async function loadMyRecords() {
      $('btnRefreshMine').disabled = true;
      showMineMsg('ok', '…');
      try {
        let records = [];
        if (IS_PUBLIC) {
          const name = accessName || localStorage.getItem('trip_access_name') || '';
          const stored = loadMyIdList();
          const list = await fetchPublicStatusMessages();
          const byId = new Map();
          for (const row of list) {
            const b = row.body;
            if (!b.id || String(b.id).startsWith('denied-')) continue;
            const matchName = name && b.accessName === name;
            const matchId = stored.some((s) => s.id === b.id);
            if (!matchName && !matchId) continue;
            if (b.accessName && !name) {
              accessName = b.accessName;
              localStorage.setItem('trip_access_name', accessName);
              updateUserBar();
            }
            const prev = byId.get(b.id);
            if (!prev || row.time >= prev._t) byId.set(b.id, Object.assign({}, b, { _t: row.time }));
          }
          for (const s of stored) {
            if (!byId.has(s.id)) {
              byId.set(s.id, {
                id: s.id,
                status: 'pending',
                date: s.date,
                plate: s.plate,
                purpose: s.purpose,
                submittedAt: s.submittedAt,
              });
            }
          }
          records = [...byId.values()]
            .sort((a, b) => String(b.submittedAt || '').localeCompare(String(a.submittedAt || '')));
        } else {
        const qs = accessCode ? `?k=${encodeURIComponent(accessCode)}` : '';
        const r = await fetch(`${VEHICLE_API}/my-records${qs}`, {
          headers: accessCode ? { 'X-Access-Code': accessCode } : {},
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '加载失败');
        if (data.accessName) {
          accessName = data.accessName;
          localStorage.setItem('trip_access_name', accessName);
          updateUserBar();
        }
        records = data.records || [];
        }
        renderMineList(records);
        showMineMsg('ok', records.length ? `共 ${records.length} 条申请` : '暂无申请记录');
      } catch (e) {
        $('mineList').innerHTML = '';
        showMineMsg('err', e.message || String(e));
      } finally {
        $('btnRefreshMine').disabled = false;
      }
    }
    $('btnRefreshMine').addEventListener('click', loadMyRecords);

    $('btnGotoStatus').addEventListener('click', () => {
      switchPanel('panelMine');
    });

    loadMeta().catch((e) => show('err', '无法连接登记服务：' + e.message));
  </script>
</body>
</html>
