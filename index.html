<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4e79" />
  <title>出车登记</title>
  <style>
    :root { --bg:#f0f3f7; --card:#fff; --ink:#1a2332; --muted:#5a6a7a; --line:#d8e0ea; --brand:#1f4e79; --brand2:#2e6da4; --ok:#1b7a4e; --danger:#b42318; }
    *{box-sizing:border-box} body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 500px at 10% -10%,#d9e8f7 0%,transparent 55%),var(--bg);min-height:100vh;padding:20px 16px 40px}
    .wrap{max-width:440px;margin:0 auto} header{text-align:center;margin-bottom:18px}
    .brand{font-size:13px;letter-spacing:.04em;color:var(--brand);font-weight:700;margin-bottom:6px;line-height:1.45}
    h1{margin:0;font-size:24px;font-weight:750}
    form{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(31,78,121,.08);padding:18px 16px 20px;display:grid;gap:14px}
    label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
    .req::after{content:" *";color:var(--danger)}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;font-family:inherit;color:var(--ink);background:#fbfcfe}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    input[readonly]{background:#eef2f6;color:var(--ink)}
    input[type=file]{padding:10px;font-size:14px;background:#fff}
    .preview{display:none;width:100%;max-height:140px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-top:4px}
    .preview.show{display:block}
    .hint{font-size:12px;font-weight:500;color:var(--muted);margin:0}
    button{appearance:none;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));cursor:pointer}
    button:disabled{opacity:.55} .msg{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.5}
    .msg.show{display:block} .msg.ok{background:#e8f6ee;color:var(--ok);border:1px solid #b7e0c7} .msg.err{background:#fdecec;color:var(--danger);border:1px solid #f3c1bd}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">中铁十八局集团南方工程有限公司</div>
      <h1>出车登记</h1>
    </header>
    <form id="form">
      <label><span class="req">日期</span><input type="date" id="date" required /></label>
      <div class="row2">
        <label>出发时间<input type="time" id="departTime" /></label>
        <label>返回时间<input type="time" id="returnTime" /></label>
      </div>
      <label>出车总时长<input id="durationText" readonly tabindex="-1" placeholder="根据出发/返回时间自动计算" /></label>
      <label><span class="req">车牌号码</span>
        <select id="plate" required>
          <option value="">请选择</option>
          <option value="粤B171TN">粤B171TN（GL8）</option>
          <option value="粤A7A07K">粤A7A07K（GL8）</option>
          <option value="粤SN18R0">粤SN18R0（租用）</option>
        </select>
      </label>
      <div class="row2">
        <label><span class="req">司机</span><input id="driver" required maxlength="40" placeholder="姓名" /></label>
        <label><span class="req">经办人</span>
          <select id="handler" required>
            <option value="">请选择</option>
            <option value="杨长京">杨长京</option>
            <option value="赵君辉">赵君辉</option>
            <option value="王涛">王涛</option>
            <option value="王惠建">王惠建</option>
            <option value="张凌源">张凌源</option>
            <option value="刘伟英">刘伟英</option>
            <option value="唐立新">唐立新</option>
            <option value="肖兵">肖兵</option>
            <option value="杜琛">杜琛</option>
            <option value="乔石">乔石</option>
            <option value="范未鹏">范未鹏</option>
            <option value="李新纪">李新纪</option>
            <option value="王昊天">王昊天</option>
            <option value="何凌霄">何凌霄</option>
            <option value="符乐">符乐</option>
          </select>
        </label>
      </div>
      <label><span class="req">事由</span><input id="purpose" required maxlength="200" placeholder="如：接送客人" /></label>
      <label><span class="req">出发地</span><input id="origin" required maxlength="200" placeholder="如：公司" /></label>
      <label><span class="req">目的地</span><input id="destination" required maxlength="200" placeholder="如：机场" /></label>
      <div class="row2">
        <label><span class="req">出发表显里程</span><input type="number" id="departOdometer" required min="0" step="0.1" inputmode="decimal" placeholder="公里" /></label>
        <label><span class="req">返程表显里程</span><input type="number" id="returnOdometer" required min="0" step="0.1" inputmode="decimal" placeholder="公里" /></label>
      </div>
      <label>行驶里程（公里）<input type="number" id="mileage" readonly tabindex="-1" placeholder="自动计算" /></label>
      <label><span class="req">出发表显照片</span>
        <input type="file" id="photoDepart" accept="image/*" capture="environment" required />
        <img class="preview" id="previewDepart" alt="" />
      </label>
      <label><span class="req">返程表显照片</span>
        <input type="file" id="photoReturn" accept="image/*" capture="environment" required />
        <img class="preview" id="previewReturn" alt="" />
      </label>
      <p class="hint">请对着里程表拍照上传，系统会自动压缩后提交。</p>
      <label>备注<input id="remark" maxlength="300" placeholder="可选" /></label>
      <button type="submit" id="btn">提交登记申请</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    const NTFY = "https://ntfy.sh";
    const TOPIC = "yue-trip-lk56m7z8ray1fq293p4d";
    const $ = (id) => document.getElementById(id);
    const today = new Date();
    $('date').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const savedDriver = localStorage.getItem('trip_driver') || '';
    if (savedDriver) $('driver').value = savedDriver;
    const lastPlate = localStorage.getItem('trip_plate');
    if (lastPlate) $('plate').value = lastPlate;
    const lastHandler = localStorage.getItem('trip_handler');
    if (lastHandler) $('handler').value = lastHandler;
    function show(type, text) { const el=$('msg'); el.className='msg show '+type; el.textContent=text; }
    function formatDuration(mins) {
      if (mins == null || !Number.isFinite(mins) || mins < 0) return '';
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h && m) return h + '小时' + m + '分钟';
      if (h) return h + '小时';
      return m + '分钟';
    }
    function recalcDuration() {
      const a = $('departTime').value;
      const b = $('returnTime').value;
      if (!a || !b) { $('durationText').value = ''; return; }
      const parse = (t) => { const p = t.split(':').map(Number); return p[0] * 60 + p[1]; };
      let x = parse(a), y = parse(b);
      if (y < x) y += 24 * 60;
      $('durationText').value = formatDuration(y - x);
    }
    function recalcMileage() {
      const a = Number($('departOdometer').value);
      const b = Number($('returnOdometer').value);
      if (!Number.isFinite(a) || !Number.isFinite(b) || $('departOdometer').value==='' || $('returnOdometer').value==='') {
        $('mileage').value = '';
        return;
      }
      const d = Math.round((b - a) * 100) / 100;
      $('mileage').value = d >= 0 ? String(d) : '';
    }
    function compressImage(file, maxSide = 1600, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.width, h = img.height;
          if (w > maxSide || h > maxSide) {
            if (w >= h) { h = Math.round(h * maxSide / w); w = maxSide; }
            else { w = Math.round(w * maxSide / h); h = maxSide; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            if (!blob) reject(new Error('图片压缩失败'));
            else resolve(blob);
          }, 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法读取图片')); };
        img.src = url;
      });
    }
    async function uploadPhoto(blob, filename) {
      const r = await fetch(NTFY + '/' + TOPIC, {
        method: 'PUT',
        headers: { 'Filename': filename, 'Title': 'Trip photo' },
        body: blob,
      });
      if (!r.ok) throw new Error('照片上传失败 HTTP ' + r.status);
      const j = await r.json();
      const url = j && j.attachment && j.attachment.url;
      if (!url) throw new Error('未取得照片链接');
      return url;
    }
    function bindPreview(inputId, previewId) {
      $(inputId).addEventListener('change', () => {
        const f = $(inputId).files && $(inputId).files[0];
        const img = $(previewId);
        if (!f) { img.classList.remove('show'); img.removeAttribute('src'); return; }
        img.src = URL.createObjectURL(f);
        img.classList.add('show');
      });
    }
    bindPreview('photoDepart', 'previewDepart');
    bindPreview('photoReturn', 'previewReturn');
    $('departTime').addEventListener('input', recalcDuration);
    $('returnTime').addEventListener('input', recalcDuration);
    $('departOdometer').addEventListener('input', recalcMileage);
    $('returnOdometer').addEventListener('input', recalcMileage);
    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn=$('btn'); btn.disabled=true;
      recalcMileage();
      recalcDuration();
      const f1 = $('photoDepart').files && $('photoDepart').files[0];
      const f2 = $('photoReturn').files && $('photoReturn').files[0];
      if (!f1 || !f2) { show('err', '请上传出发与返程表显照片'); btn.disabled=false; return; }
      try {
        show('ok', '正在压缩照片…');
        const [b1, b2] = await Promise.all([compressImage(f1), compressImage(f2)]);
        const stamp = Date.now().toString(36);
        show('ok', '正在上传照片…');
        const [photoDepartUrl, photoReturnUrl] = await Promise.all([
          uploadPhoto(b1, 'depart-' + stamp + '.jpg'),
          uploadPhoto(b2, 'return-' + stamp + '.jpg'),
        ]);
        const payload = {
          type: 'trip_request',
          date: $('date').value,
          plate: $('plate').value,
          driver: $('driver').value.trim(),
          handler: $('handler').value,
          purpose: $('purpose').value.trim(),
          origin: $('origin').value.trim(),
          destination: $('destination').value.trim(),
          departTime: $('departTime').value,
          returnTime: $('returnTime').value,
          durationText: $('durationText').value,
          departOdometer: $('departOdometer').value,
          returnOdometer: $('returnOdometer').value,
          mileage: $('mileage').value,
          photoDepartUrl,
          photoReturnUrl,
          remark: $('remark').value.trim(),
          submittedAt: new Date().toISOString(),
        };
        show('ok', '正在提交申请…');
        const r = await fetch(NTFY + '/' + TOPIC, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json; charset=utf-8',
            'Title': 'Trip request',
            'Tags': 'car,office',
            'Priority': 'default',
          },
          body: JSON.stringify(payload),
        });
        if (!r.ok) throw new Error('提交失败 HTTP ' + r.status);
        localStorage.setItem('trip_driver', payload.driver);
        localStorage.setItem('trip_plate', payload.plate);
        localStorage.setItem('trip_handler', payload.handler);
        show('ok', '已提交，等待办公室同意。可关闭本页。');
        $('purpose').value=''; $('origin').value=''; $('destination').value='';
        $('departTime').value=''; $('returnTime').value=''; $('durationText').value='';
        $('departOdometer').value=''; $('returnOdometer').value=''; $('mileage').value=''; $('remark').value='';
        $('photoDepart').value=''; $('photoReturn').value='';
        $('previewDepart').classList.remove('show');
        $('previewReturn').classList.remove('show');
      } catch (err) {
        const tip = (err && err.message) ? err.message : String(err);
        show('err', tip.replace(/^TypeError:\s*/i, '提交失败：'));
      } finally { btn.disabled=false; }
    });
  </script>
</body>
</html>
